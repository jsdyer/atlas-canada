name: Atlas Canada · Collect
on:
  push:
    branches: [main]
    paths: [scripts/reanalyse.py]
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: atlas-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test the collector
        run: python3 -m unittest tests.test_collect
      - name: Reassess existing measurement results without creating measurements
        if: github.event_name == 'push'
        run: python3 scripts/reanalyse.py
      - name: Run traceroutes and save a capture
        if: github.event_name != 'push'
        env:
          RIPE_ATLAS_KEY: ${{ secrets.RIPE_ATLAS_KEY }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          PEERINGDB_API_KEY: ${{ secrets.PEERINGDB_API_KEY }}
        run: python3 scripts/collect.py
      - name: Commit the capture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data
          git diff --cached --quiet && exit 0
          git commit -m "Add Atlas capture $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
      - name: Publish the updated page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"
